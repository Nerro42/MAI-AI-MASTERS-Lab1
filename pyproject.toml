[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradnet"
version = "0.2.0"
description = "Tiny reverse-mode autodiff neural net library (NumPy)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "nn-framework lab group" }]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pytest>=8.0",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gradnet*"]
exclude = ["examples*", "tests*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
